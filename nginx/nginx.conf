# Gateway / balanceador de carga delante de las réplicas de la API.
events {}

http {
    log_format balanceo '$remote_addr "$request" $status -> réplica $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout balanceo;

    # "api" es el nombre del servicio en docker-compose. El DNS interno de
    # Docker devuelve UNA IP POR RÉPLICA; nginx crea un servidor por cada
    # IP y reparte las solicitudes en round-robin.
    # (Al escalar hay que reiniciar el gateway para que vuelva a resolver.)
    upstream api_backend {
        server api:8000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Si una réplica cae, se reintenta en otra. Nginx NO reintenta
            # un POST que ya llegó a una réplica (no es idempotente); solo
            # si la conexión ni siquiera se pudo establecer.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
